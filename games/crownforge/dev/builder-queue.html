<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Builder queue check</title><style>body{background:#15251d;color:#eee;font:18px system-ui;padding:24px}button{padding:14px}li{padding:10px}</style><h1>Builder queue check</h1><p>Uses the game simulation. Place three foundations before the worker reaches the first, then watch them finish in order at accelerated speed.</p><button id="place">Place three foundations</button><p id="status">Ready</p><ol id="jobs"></ol><script type="module">
import {CrownforgeSimulation} from '../src/simulation.js?v=20260911-builderqueue1';
const s=new CrownforgeSimulation({seed:42});s.units=[];s.buildings=[];s.resourcesNodes=[];s.decorations=[];s.navigationVersion++;s._checkVictory=()=>{};s._updateEnemyAI=()=>{};s._updateEnemyIntent=()=>{};s._updateMilitaryServices=()=>{};s.resources={food:99999,wood:99999,stone:99999,gold:99999};const u=s.addUnit('villager',140,180,'player');s.selectedIds=[u.id];s._syncSelectionFlags();let sites=[],done=[];
document.querySelector('button').onclick=()=>{for(const x of [180,230,280]){if(!s.placeBuilding('homestead',{x,z:180}))throw Error(s.lastCommand);sites.push(s.buildings.at(-1));}document.querySelector('button').disabled=true;document.querySelector('#status').textContent=`First job active; ${u.orderQueue.length} queued`;};
setInterval(()=>{if(!sites.length)return;for(let i=0;i<20;i++)s.update(.05);for(const b of sites)if(b.progress===1&&!done.includes(b.id))done.push(b.id);document.querySelector('#jobs').innerHTML=sites.map((b,i)=>`<li>Foundation ${i+1}: ${Math.round(b.progress*100)}%${u.buildTarget===b.id?' · current':''}</li>`).join('');document.querySelector('#status').textContent=done.length===3?`Complete in order: ${done.map(id=>sites.findIndex(b=>b.id===id)+1).join(' → ')}`:`${u.actionLabel} · ${u.orderQueue.length} waiting`;},25);
</script>
