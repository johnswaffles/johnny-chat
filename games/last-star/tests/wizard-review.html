<!doctype html><meta charset="utf-8"><title>Wizard animation review</title><style>body{background:#132735;color:#fff;font:18px sans-serif}canvas{border:1px solid #718291}button{padding:12px}</style><h1>Wizard motion review</h1><button id="toggle">Pause animation</button><button id="next">Next frame</button><button id="idle">Standing</button><button id="run">Jog</button><button id="rise">Rising</button><button id="fall">Falling</button><button id="jump">Preview jump</button><p id="status"></p><canvas width="800" height="550"></canvas><script type="module">
import {Renderer,loadArt} from '../src/render.js?idle-art=2';import {advanceWizardAnimation} from '../src/wizard-animation.js?idle-art=2';
const canvas=document.querySelector('canvas'),art=await loadArt(),r=new Renderer(canvas,art);canvas.width=800;canvas.height=550;r.camera=0;let moving=true,last=0,jumping=false;
const p={x:125,y:165,vx:220,vy:0,onGround:true,face:1,cast:0,mantle:0};
document.querySelector('#toggle').onclick=()=>{moving=!moving;document.querySelector('#toggle').textContent=moving?'Pause animation':'Play animation';};
document.querySelector('#next').onclick=()=>{moving=false;if(r.wizardAnimation.idle)r.wizardAnimation.idleFrame=(r.wizardAnimation.idleFrame+1)%8;else if(p.onGround)r.wizardAnimation.walkFrame=(r.wizardAnimation.walkFrame+1)%8;else r.wizardAnimation.airFrame=(r.wizardAnimation.airFrame+1)%8;};
document.querySelector('#idle').onclick=()=>{jumping=false;p.onGround=true;p.vx=0;p.y=165;moving=true;document.querySelector('#toggle').textContent='Pause animation';};
for(const [id,ground,vy] of [['run',true,0],['rise',false,-220],['fall',false,220]])document.querySelector('#'+id).onclick=()=>{jumping=false;p.vx=220;p.onGround=ground;p.vy=vy;p.y=165;moving=true;document.querySelector('#toggle').textContent='Pause animation';};
document.querySelector('#jump').onclick=()=>{p.onGround=false;p.vy=-260;p.y=165;jumping=true;moving=true;document.querySelector('#toggle').textContent='Pause animation';};
function draw(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(moving){if(jumping){p.vy+=650*dt;p.y+=p.vy*dt;if(p.y>=165){p.y=165;p.onGround=true;jumping=false;}}r.time+=dt;advanceWizardAnimation(r.wizardAnimation,p,dt);}const c=r.ctx;c.setTransform(1,0,0,1,0,0);c.fillStyle='#233c4e';c.fillRect(0,0,800,550);for(let y=0;y<550;y+=24){c.fillStyle=y%48?'#516568':'#233c4e';c.fillRect(0,y,800,12);}c.setTransform(3,0,0,3,0,0);r.wizard(p);document.querySelector('#status').textContent=`${r.wizardAnimation.airborne?"Air":r.wizardAnimation.idle?"Standing":"Jog"} artwork · Frame ${(r.wizardAnimation.airborne?r.wizardAnimation.airFrame:r.wizardAnimation.idle?r.wizardAnimation.idleFrame:r.wizardAnimation.walkFrame)+1}/8 · Body opacity 100%`;requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script>
