<!doctype html><meta charset="utf-8"><title>Spell effects review</title><style>body{margin:0;background:#081821;color:white;font:16px sans-serif}button{padding:10px;margin:5px}canvas{width:100%;max-width:1280px}</style><button id="gather">Star chart</button><button id="fall">Starfall</button><button id="impact">Impact</button><button id="play">Play spell sequence</button><button id="gentle">Toggle gentle effects</button><p id="status"></p><canvas></canvas><script type="module">
import {Renderer,loadArt} from '../src/render.js?spell-vfx=2';import {Game} from '../src/game.js';const canvas=document.querySelector('canvas'),r=new Renderer(canvas,await loadArt()),g=new Game();canvas.width=1280;canvas.height=720;r.scale=1;r.w=1280;r.camera=1800;r.title=false;g.player.x=2150;g.player.y=580;let age=.16,play=false,last=0;
for(const [id,t] of [['gather',.16],['fall',.46],['impact',.78]])document.querySelector('#'+id).onclick=()=>{age=t;play=false;};
document.querySelector('#play').onclick=()=>{age=0;play=true;};document.querySelector('#gentle').onclick=()=>r.gentle=!r.gentle;
function frame(now){const dt=Math.min((now-last)/1000||0,.04);last=now;if(play){age+=dt;if(age>2)age=0;}g.effects=age<1.7?[{type:'constellation',x:2520,y:580,age,life:1.7-age}]:[];g.projectiles=[{owner:'player',x:2300,y:512,vx:900,vy:0},{owner:'player',x:2200,y:495,vx:820,vy:-100}];r.time+=dt;r.draw(g,0);document.querySelector('#status').textContent=`Spell age ${age.toFixed(2)} s · damage impact 0.60 s · ${r.gentle?'Gentle':'Rich'} effects`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
