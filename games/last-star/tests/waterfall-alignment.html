<!doctype html><meta charset="utf-8"><title>Waterfall registration review</title><style>body{margin:0;background:#081821;color:white;font:16px sans-serif}canvas{max-width:100%}</style><p>Waterfall registration over source artwork (numbered animation regions)</p><canvas width="1280" height="720"></canvas><script type="module">
import {FALLS,ACTIVE_WATERFALL_IDS,waterfallTransform} from '../src/waterfalls.js';const im=new Image();im.src='../assets/last-star-valley-detail-v2.png';await im.decode();const c=document.querySelector('canvas').getContext('2d'),t=waterfallTransform(im,1280,0,7900);c.drawImage(im,t.x,t.y,t.width,t.height);c.font='20px sans-serif';for(const id of ACTIVE_WATERFALL_IDS){const [x,top,bottom,w,dx]=FALLS[id],px=x*t.width,py=top*t.height+t.y;c.strokeStyle='#ff9d6e';c.strokeRect(px-w*t.width*.6,py,w*t.width*1.2+dx*t.width,(bottom-top)*t.height);c.fillStyle='#fff';c.fillText(String(id),px,py-5);}
</script>
