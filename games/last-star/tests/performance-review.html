<!doctype html><meta charset="utf-8"><title>Level 1 repeatable performance test</title><style>body{margin:0;background:#071922;color:white;font:14px sans-serif}canvas{width:100vw;height:80vh}button{padding:12px}output{white-space:pre-wrap}</style><label>Quality <select id="quality"><option value="high">Rich</option><option value="low">Light</option></select></label><label>Enemy count <select id="count"><option value="2">Actual encounter (2)</option><option value="12">Stress test (12)</option></select></label><label><input id="layers" type="checkbox" checked>New scenery</label><label><input id="lighting" type="checkbox" checked>Reactive light</label><button id="run" disabled>Profile 300 busy frames</button><output id="result">Loading baseline…</output><canvas id="world"></canvas><script type="module">
import {Game} from '../src/game.js';import {Renderer,loadArt} from '../src/render.js';
const art=await loadArt(),r=new Renderer(document.querySelector('#world'),art);r.title=false;let g;
const reset=()=>{g=new Game();g.player.x=1440;g.player.y=560;g.player.invuln=999;g.checkpoint=3;r.camera=970;g.enemies.filter(e=>e.type!=='boss').forEach((e,i)=>{e.dead=i>=Number(document.querySelector("#count").value);e.x=Number(document.querySelector("#count").value)===2?1510+i*150:1230+i*55;e.y=560;e.hp=e.maxHp=100000});};reset();r.draw(g,0);document.querySelector('button').disabled=false;document.querySelector('output').textContent='Ready — Rich quality, selected enemy count, sustained staff fire, Silverwood layered scenery';
document.querySelector('button').onclick=()=>{r.quality=document.querySelector('select').value;r.resize();r.previewLayers=document.querySelector("#layers").checked;r.previewLighting=document.querySelector("#lighting").checked;reset();const costs=[],deltas=[];let last=0,n=0;document.querySelector('button').disabled=true;function frame(t){if(last&&n>30)deltas.push(t-last);last=t;const a=performance.now();g.update(1/60,{bolt:true,aimX:1780,aimY:505});for(const e of g.events)r.event(e);g.events=[];r.draw(g,1/60);const cost=performance.now()-a;if(n>30)costs.push(cost);if(++n<330)requestAnimationFrame(frame);else{const sorted=a=>[...a].sort((a,b)=>a-b),mean=a=>a.reduce((s,v)=>s+v,0)/a.length;document.querySelector('output').textContent=JSON.stringify({quality:r.quality,enemies:Number(document.querySelector("#count").value),frames:costs.length,viewport:[innerWidth,innerHeight],dpr:devicePixelRatio,meanWorkMs:+mean(costs).toFixed(2),p95WorkMs:+sorted(costs)[Math.floor(costs.length*.95)].toFixed(2),meanFrameMs:+mean(deltas).toFixed(2),p95FrameMs:+sorted(deltas)[Math.floor(deltas.length*.95)].toFixed(2),particles:r.particles.length,projectiles:g.projectiles.length},null,2);document.querySelector('button').disabled=false;}}requestAnimationFrame(frame)};
</script>
