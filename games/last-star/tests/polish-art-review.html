<!doctype html><meta charset="utf-8"><title>Silverwood painted pose review</title><style>body{margin:0;background:#102334;color:#e3e9e9;font:16px sans-serif}button{padding:12px}canvas{display:block}</style><button id="flip">Face left</button><p>New painted action frames · same foot baseline · no body crossfade</p><canvas width="1280" height="620"></canvas><script type="module">
import {actionPose,drawPaintedPose} from '../src/action-poses.js';const im=new Image();im.src='../assets/arcanist-actions-v2.png';await im.decode();const c=document.querySelector('canvas').getContext('2d');let face=1;function draw(){c.clearRect(0,0,1280,620);for(let i=0;i<8;i++){const a=actionPose(i),x=(i%4)*320+160,y=Math.floor(i/4)*280+270,k=1.8;c.save();c.translate(x,y);c.strokeStyle='#658593';c.beginPath();c.moveTo(-160,0);c.lineTo(160,0);c.stroke();c.scale(face*k,k);drawPaintedPose(c,im,a);c.restore();c.fillStyle='white';c.fillText(['Raise','Aim','Release','Follow-through','Brace','Recover','Land','Rise'][i],x-80,y+24);}}draw();document.querySelector('button').onclick=()=>{face=-face;draw();};
</script>
