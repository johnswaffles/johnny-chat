<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silverwood gorge · environment study</title>
<style>body{margin:0;background:#071922;color:#dce9eb;font:14px system-ui}header{padding:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,a{color:#e0c996;background:#132d3d;border:1px solid #7397a4;padding:9px;text-decoration:none}#stage{position:relative;height:calc(100vh - 100px);overflow:hidden}#world{width:100%;height:100%;display:block}output{display:block;padding:5px 12px;font:12px monospace;white-space:pre-wrap}button:focus{outline:2px solid white}</style>
<header><strong>Silverwood · environment study</strong><button id="west">Forest edge</button><button id="center">Waterfall</button><button id="east">Aqueduct</button><button id="pit">Pit edge</button><button id="seam">Former switch</button><button id="late">Later level</button><button id="end">Observatory</button><button id="walk">Walk through grass</button><button id="pause">Pause motion</button><button id="verify">Verify motion & recovery</button><a href="../?gorge=1">Play the game →</a></header><output id="result">Loading scenery…</output><div id="stage"><canvas id="world"></canvas></div>
<script type="module">
import {loadArt,Renderer} from '../src/render.js';import {Game,PLATFORMS} from '../src/game.js';
// Open with ?gorge=1 so art loading/renderer opt into the local study.
const r=new Renderer(document.querySelector('#world'),await loadArt()),g=new Game();
r.title=false;r.quality='high';r.resize();g.enemies.forEach(e=>e.dead=true);g.player.x=1235;g.player.y=560;r.camera=Math.max(0,g.player.x-r.w*.37);
let paused=false,last=0,testing=false,walking=false,direction=1;
const result=document.querySelector('#result');result.textContent=r.gorge?.ready?'Living grass, wildflowers and mountain detail · Choose a view or try the walking demonstration.':'GPU scene unavailable — fallback active.';
for(const [id,x] of [['west',230],['center',1235],['east',2050],['pit',1900],['seam',2400],['late',4600],['end',7300]])document.querySelector('#'+id).onclick=()=>{walking=false;g.player.vx=0;document.querySelector('#walk').textContent='Walk through grass';g.player.x=x;g.player.y=PLATFORMS.find(p=>(id==='pit'?p.id===12:!p.upper)&&x>=p.x&&x<=p.x+p.w).y;r.camera=Math.max(0,x-r.w*.37);};
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume motion':'Pause motion';};
document.querySelector('#walk').onclick=()=>{walking=!walking;result.textContent='Watch the grass and flowers bend as the wizard passes, then settle back into the breeze.';if(walking){g.player.x=1260;g.player.y=560;g.player.onGround=true;direction=1;}g.player.vx=0;document.querySelector('#walk').textContent=walking?'Stop walking':'Walk through grass';};
addEventListener('resize',()=>r.resize());
function frame(t){const dt=last?Math.min(.05,(t-last)/1000):0;last=t;if(!testing){if(walking&&!paused){if(g.player.x>=1740)direction=-1;if(g.player.x<=1260)direction=1;g.player.vx=direction*180;g.player.face=direction;g.player.x+=g.player.vx*dt;}r.draw(g,paused?0:dt);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
const pixels=()=>{const gl=r.gorge.gl,w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,p=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,p);let hash=2166136261;for(let i=0;i<p.length;i+=13)hash=Math.imul(hash^p[i],16777619);return hash>>>0;};
document.querySelector('#verify').onclick=async()=>{if(!r.gorge?.ready)return;testing=true;const saved=r.time;const reports=[];
try{r.time=0;r.gorge.draw(r);const first=pixels();r.time=20;r.gorge.draw(r);const second=pixels();r.gorge.draw(r);const frozen=pixels();reports.push('Independent motion: '+(first!==second?'PASS':'FAIL'),'Paused redraw identical: '+(second===frozen?'PASS':'FAIL'),'WebGL error: '+r.gorge.gl.getError());
const frontHash=()=>{const data=r.ctx.getImageData(0,0,r.canvas.width,r.canvas.height).data;let h=2166136261;for(let i=0;i<data.length;i+=13)h=Math.imul(h^data[i],16777619);return h>>>0;};r.draw(g,0);const frontA=frontHash();r.draw(g,0);reports.push('Paused plants identical: '+(frontA===frontHash()?'PASS':'FAIL'));
const ext=r.gorge.gl.getExtension('WEBGL_lose_context');if(ext){ext.loseContext();await new Promise(resolve=>setTimeout(resolve,100));r.draw(g,0);reports.push('Context-loss fallback: '+(!r.backgroundCanvas.hidden?'PASS':'FAIL'));ext.restoreContext();await new Promise(resolve=>setTimeout(resolve,500));r.draw(g,0);reports.push('Context restored: '+(r.gorge.ready?'PASS':'FAIL'));}else reports.push('Context-loss extension unavailable');
}catch(e){reports.push('FAIL '+e.message);}finally{r.time=saved;testing=false;result.textContent=reports.join(' · ');}};
</script></html>
