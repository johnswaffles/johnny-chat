<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#122b30" />
    <title>Cozy Search · The Night Atlas</title>
    <meta
      name="description"
      content="Explore six illustrated places in a word search with crossword clues, a hidden final word, and a new shared puzzle every day."
    />
    <link rel="stylesheet" href="./atlas.css?v=1" />
  </head>
  <body>
    <header class="masthead">
      <div class="wrap nav">
        <a href="/" class="brand"
          ><span class="star" aria-hidden="true">✷</span> Johnny’s Game Shelf</a
        >
        <nav aria-label="Game">
          <details id="games">
            <summary>Games</summary>
            <div class="menu">
              <a href="/crownforge/">Crownforge</a
              ><a href="https://crownforge-oathbound.onrender.com/">Oathbound</a
              ><a href="/last-star/">Last Star</a
              ><a href="/cozy-builder-game/">Cozy Builder</a
              ><a href="/tetris/">Cozy Falling Blocks</a>
            </div>
          </details>
          <button id="journal">
            Field journal <span id="journal-count">0/6</span></button
          ><button id="settings" aria-label="How to play and settings">
            ☷ <span>Guide</span>
          </button>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <header class="title-row">
        <div>
          <p class="eyebrow"><i></i> THE NIGHT ATLAS</p>
          <h1>Cozy Search<span>.</span></h1>
        </div>
        <div class="modes" aria-label="Puzzle mode">
          <button id="free" aria-pressed="true">Free play</button
          ><button id="daily" aria-pressed="false">Daily edition</button>
        </div>
      </header>
      <section class="edition" aria-labelledby="edition-name">
        <div class="edition-copy">
          <div class="eyebrow" id="edition-type">FIELD EDITION</div>
          <h2 id="edition-name"></h2>
          <p id="edition-note"></p>
        </div>
        <div id="hero-art" class="hero-art" aria-hidden="true"></div>
      </section>
      <div class="play-layout">
        <section class="board-panel" aria-label="Letter board">
          <div class="section-top">
            <div class="board-meta">
              <label for="level">Level</label
              ><select id="level">
                <option value="easy">Easy</option>
                <option value="casual">Casual</option>
                <option value="tricky">Tricky</option>
                <option value="hard">Hard</option>
                <option value="expert">Very hard</option>
              </select>
            </div>
            <button id="new" class="text-action">
              <span aria-hidden="true">↻</span> New puzzle
            </button>
          </div>
          <div id="pocket">
            <b id="pocket-label"></b><span id="pocket-entry"></span
            ><button id="pocket-next" aria-label="Show next target">›</button>
          </div>
          <div class="paper">
            <div class="paper-meta">
              <span id="direction"></span
              ><span id="timer" aria-label="Time playing">0:00</span>
            </div>
            <div
              id="board"
              role="grid"
              aria-label="Letter grid"
              aria-describedby="board-tip"
            ></div>
            <div class="paper-foot">
              <span id="coordinates"></span><span aria-hidden="true">✴</span
              ><span id="board-size"></span>
            </div>
          </div>
          <p class="board-tip" id="board-tip">
            Drag through a word or tap its two ends.
          </p>
        </section>
        <aside aria-label="Puzzle guide">
          <section class="guide-panel">
            <div class="guide-heading">
              <h2 id="list-heading">Word list</h2>
              <svg id="sky" viewBox="0 0 101 30" aria-hidden="true"></svg
              ><span id="found-count"></span>
            </div>
            <div class="progress"><i id="progress"></i></div>
            <div class="guide-options" aria-label="Word guide">
              <button id="words-mode" aria-pressed="true">Words</button
              ><button id="clues-mode" aria-pressed="false">Clues</button>
            </div>
            <ul id="words" aria-labelledby="list-heading"></ul>
            <section class="mystery" id="mystery">
              <div class="mystery-icon" aria-hidden="true">✧</div>
              <div>
                <h3>Final mystery</h3>
                <p id="mystery-copy"></p>
                <strong id="mystery-mask"></strong>
              </div>
            </section>
            <button id="hint" class="hint">Give me a hint</button>
            <p id="feedback" role="status" aria-live="polite"></p>
          </section>
        </aside>
      </div>
    </main>
    <dialog id="dialog">
      <div class="dialog-top">
        <span class="eyebrow" id="dialog-kicker"></span
        ><button id="close" aria-label="Close">×</button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <template id="guide-template"
      ><h2>Field guide</h2>
      <p>
        Find each listed word in a straight line, then solve the final riddle
        and find its answer on the same board.
      </p>
      <p>
        Drag or tap the two ends in either order. On a keyboard, use the arrows
        to move, Enter or Space to choose each end, and Escape to start over.
      </p>
      <p>
        Switch to Clues to solve each entry from its description. Successive
        hints give a starting letter, a direction, then a brief look at the
        path. Finish without hints to earn a gold seal. For an atlas star,
        select Clues before opening a fresh map and solve it entirely from clues
        without hints.
      </p>
      <p>
        Free play opens a fresh map each visit. Your daily edition is shared by
        local calendar date and saves progress on this device.
      </p></template
    >

    <div id="audio-controls" hidden>
      <label for="soundtrack-select">Soundtrack</label
      ><select id="soundtrack-select" aria-label="Soundtrack">
        <option value="cozy">Johnny’s Cozy Theme</option>
        <option value="dreamy-clouds">Dreamy Clouds</option>
        <option value="neon-dreams">Neon Dreams</option>
        <option value="whimsical-waltz">Whimsical Waltz</option>
        <option value="crownforge-rp">Johnny’s RP</option>
        <option value="nocturnal-calm">Nocturnal Calm</option>
        <option value="loop-all">Loop all</option></select
      ><button id="music-button" aria-pressed="false">
        <span id="music-button-label">Music off</span>
      </button>
    </div>
    <audio id="game-music" data-johnny-music preload="none"></audio>
    <script src="/audio-focus.js?v=1"></script>
    <script src="./atlas-audio.js?v=1"></script>
    <script type="module" src="./atlas.mjs?v=1"></script>
  </body>
</html>
