<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hearthkin · four-view animation review</title><style>body{margin:0;background:#14231e;color:#eee7d2;font:16px system-ui}header{padding:18px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px;background:#243e34;color:inherit;border:1px solid #65836f;border-radius:6px}canvas{width:100%;max-width:1400px;display:block;margin:auto}output{padding:15px;display:block}a{color:#b5dfe7}</style><header><strong>Hearthkin · Blender character</strong><label>Animation <select id="clip"></select></label><button id="play">Pause</button><label>Speed <select id="speed"><option value="1">Normal</option><option value=".5">Half speed</option></select></label><a href="./blender-worker-game.html">In-game review</a></header><canvas id="review" width="1400" height="650"></canvas><output id="status">Loading character views…</output><script type="module">
import {BlenderHearthkinRenderer} from '../src/hearthkin-blender-renderer.js?v=20260911-worker-v010';import {HEARTHKIN_BLENDER_ART as art} from '../src/hearthkin-blender-art.js?v=20260911-worker-v010';
const rig=new BlenderHearthkinRenderer(),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),select=document.querySelector('#clip'),status=document.querySelector('#status');for(const name of Object.keys(art.se)){const option=document.createElement('option');option.textContent=option.value=name;select.append(option);}select.value='Walk';let playing=true,t=0,last=performance.now();document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';};select.onchange=()=>{t=0;};function render(now){if(playing)t+=(now-last)/1000*Number(document.querySelector('#speed').value);last=now;ctx.clearRect(0,0,1400,650);const ready=rig.readiness().filter(im=>im.complete&&im.naturalWidth).length;status.textContent=`${select.value} · ${ready} / ${rig.readiness().length} sheets ready · all four cameras are rendered independently`;for(let i=0;i<4;i++){const x=175+i*350;ctx.strokeStyle='#648275';ctx.beginPath();ctx.moveTo(x-150,525);ctx.lineTo(x+150,525);ctx.stroke();ctx.fillStyle='#efe7d1';ctx.textAlign='center';ctx.font='20px system-ui';ctx.fillText(['SE','SW','NE','NW'][i],x,580);rig.draw(ctx,{animationState:select.value,paintedFacing:i,motionSpeed:1},{x,y:525},350,1,t);}requestAnimationFrame(render);}requestAnimationFrame(render);
